name: needex-be

services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskview}
      POSTGRES_USER: ${POSTGRES_USER:-taskview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - taskview_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - needex

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["local-mail"]
    restart: unless-stopped
    ports:
      - "${MAILPIT_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - needex

  be:
    build:
      context: .
    restart: unless-stopped
    environment:
      TASKVIEW_DATABASE_URL: postgresql://${POSTGRES_USER:-taskview}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskview}
      TASKVIEW_AI_URL: ${TASKVIEW_AI_URL:?TASKVIEW_AI_URL is required}
      TASKVIEW_AI_SHARED_SECRET: ${TASKVIEW_AI_SHARED_SECRET:?TASKVIEW_AI_SHARED_SECRET is required}
      TASKVIEW_BE_FAKE_AI: ${TASKVIEW_BE_FAKE_AI:-false}
      TASKVIEW_PUBLIC_WEB_URL: ${TASKVIEW_PUBLIC_WEB_URL:?TASKVIEW_PUBLIC_WEB_URL is required}
      TASKVIEW_CORS_ORIGINS: ${TASKVIEW_CORS_ORIGINS:?TASKVIEW_CORS_ORIGINS is required}
      TASKVIEW_SESSION_DAYS: ${TASKVIEW_SESSION_DAYS:-7}
      TASKVIEW_EXPOSE_DEV_TOKENS: "false"
      TASKVIEW_REQUIRE_EMAIL_VERIFICATION: "false"
      TASKVIEW_DELIVERY_ENCRYPTION_KEY: ${TASKVIEW_DELIVERY_ENCRYPTION_KEY:?TASKVIEW_DELIVERY_ENCRYPTION_KEY is required}
      TASKVIEW_SMTP_HOST: ${TASKVIEW_SMTP_HOST:?TASKVIEW_SMTP_HOST is required}
      TASKVIEW_SMTP_PORT: ${TASKVIEW_SMTP_PORT:-587}
      TASKVIEW_SMTP_USERNAME: ${TASKVIEW_SMTP_USERNAME:-}
      TASKVIEW_SMTP_PASSWORD: ${TASKVIEW_SMTP_PASSWORD:-}
      TASKVIEW_SMTP_FROM_EMAIL: ${TASKVIEW_SMTP_FROM_EMAIL:?TASKVIEW_SMTP_FROM_EMAIL is required}
      TASKVIEW_SMTP_USE_TLS: ${TASKVIEW_SMTP_USE_TLS:-false}
      TASKVIEW_SMTP_USE_STARTTLS: ${TASKVIEW_SMTP_USE_STARTTLS:-true}
      TASKVIEW_MAIL_WORKER_ENABLED: "true"
      TASKVIEW_DATA_SOURCE_ALLOWED_HOSTNAMES: ${TASKVIEW_DATA_SOURCE_ALLOWED_HOSTNAMES:-}
      TASKVIEW_DATA_SOURCE_ALLOWED_CIDRS: ${TASKVIEW_DATA_SOURCE_ALLOWED_CIDRS:-}
      TASKVIEW_DATA_SOURCE_REQUIRE_TLS: ${TASKVIEW_DATA_SOURCE_REQUIRE_TLS:-true}
      TASKVIEW_DATA_SOURCE_VERIFY_TLS: ${TASKVIEW_DATA_SOURCE_VERIFY_TLS:-true}
      TASKVIEW_DATA_SOURCE_TLS_CA_FILE: ${TASKVIEW_DATA_SOURCE_TLS_CA_FILE:-}
      TASKVIEW_DATA_SOURCE_ENCRYPTION_KEY: ${TASKVIEW_DATA_SOURCE_ENCRYPTION_KEY:?TASKVIEW_DATA_SOURCE_ENCRYPTION_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BE_BIND_ADDRESS:-0.0.0.0}:${BE_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - needex

volumes:
  taskview_postgres_data:

networks:
  needex:
    name: ${NEEDEX_NETWORK:-needex_internal}
    external: true
